<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dormitory: After Hours</title>
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="730" height="270"></canvas>
    <div id="ui">
      <div id="hud" class="hidden">
        <div id="hud-char" class="px-box">
          <img id="hud-portrait" class="portrait" alt="">
          <div class="hud-char-text">
            <div id="hud-name"></div>
            <div class="hud-hint"><span class="key">TAB</span> сменить</div>
          </div>
          <img id="hud-portrait2" class="portrait small" alt="">
        </div>
        <div id="hud-right">
          <div id="hud-room" class="px-box">
            <div id="hud-room-name"></div>
            <div id="hud-room-sub"></div>
          </div>
          <div id="hud-found" class="px-box"><span id="hud-found-n"></span><span class="key">I</span></div>
        </div>
      </div>
      <div id="prompt" class="hidden"><span class="key">E</span><span id="prompt-text"></span></div>
      <div id="banner" class="hidden"></div>
      <div id="toasts"></div>
      <div id="dialogue" class="px-box hidden">
        <img id="dlg-portrait" class="portrait" alt="">
        <div id="dlg-body">
          <div id="dlg-name"></div>
          <div id="dlg-text"></div>
        </div>
        <div id="dlg-next">▼</div>
      </div>
      <div id="screens"></div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
